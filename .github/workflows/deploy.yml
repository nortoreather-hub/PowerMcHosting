name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_publish:
    name: Build and publish container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/powermchosting:latest

  deploy_via_ssh:
    name: Optional SSH deploy
    needs: build_and_publish
    runs-on: ubuntu-latest
    if: ${{ secrets.SSH_HOST && secrets.SSH_PRIVATE_KEY && secrets.SSH_USER }}
    steps:
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to remote host
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/powermchosting:latest
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker pull $IMAGE || true && docker stop powermchosting || true && docker rm powermchosting || true && docker run -d --restart unless-stopped --name powermchosting $IMAGE"
