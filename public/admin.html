<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PowerHosting Admin</title>
    <style>body{font-family:system-ui,Arial;margin:20px}input,button{padding:6px;margin:4px}</style>
  </head>
  <body>
    <h1>PowerHosting — Admin Panel</h1>
    <div id="login">
      <h3>Login</h3>
      <input id="username" placeholder="username" />
      <input id="password" type="password" placeholder="password" />
      <button id="btnLogin">Login</button>
      <div id="loginMsg"></div>
    </div>

    <div id="panel" style="display:none">
      <h3>Servers</h3>
      <div id="servers"></div>
      <h4>Add Server</h4>
      <input id="s_id" placeholder="id" />
      <input id="s_name" placeholder="name" />
      <button id="btnAddServer">Add</button>
      <h4>Users (owner only)</h4>
      <div id="users"></div>
      <h4>Create User</h4>
      <input id="u_name" placeholder="username" />
      <input id="u_pass" placeholder="password" />
      <select id="u_role"><option value="admin">admin</option><option value="owner">owner</option></select>
      <button id="btnCreateUser">Create</button>
    </div>

    <script>
      const api = (path, opts={}) => {
        const token = localStorage.getItem('ph_token');
        opts.headers = opts.headers || {};
        opts.headers['Content-Type'] = 'application/json';
        if (token) opts.headers['Authorization'] = 'Bearer ' + token;
        return fetch('/api' + path, opts).then(r => r.json().then(b => ({status: r.status, body: b}))); 
      };

      document.getElementById('btnLogin').onclick = async () => {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const r = await api('/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        if (r.status === 200) { localStorage.setItem('ph_token', r.body.token); showPanel(); }
        else document.getElementById('loginMsg').innerText = r.body.error || 'login failed';
      };

      async function showPanel(){
        document.getElementById('login').style.display='none';
        document.getElementById('panel').style.display='block';
        await loadServers();
        await loadUsers();
      }

      async function loadServers(){
        const r = await api('/servers');
        const el = document.getElementById('servers'); el.innerHTML='';
        if (r.status!==200) { el.innerText = r.body.error || 'error'; return; }
        r.body.forEach(s => {
          const d = document.createElement('div');
          d.innerHTML = `<strong>${s.name}</strong> (id:${s.id}) access: ${ (s.access||[]).join(',') } <br/>` +
            `<input placeholder="username to grant" id="g_${s.id}" /> <button data-id="${s.id}" class="btnGrant">Grant</button> <button data-id="${s.id}" class="btnRevoke">Revoke</button>`;
          el.appendChild(d);
        });
        document.querySelectorAll('.btnGrant').forEach(b=>b.onclick = async ev=>{
          const id = ev.target.dataset.id; const u = document.getElementById('g_'+id).value;
          await api('/servers/'+id+'/grant', { method: 'POST', body: JSON.stringify({ username: u }) }); loadServers();
        });
        document.querySelectorAll('.btnRevoke').forEach(b=>b.onclick = async ev=>{
          const id = ev.target.dataset.id; const u = document.getElementById('g_'+id).value;
          await api('/servers/'+id+'/revoke', { method: 'POST', body: JSON.stringify({ username: u }) }); loadServers();
        });
      }

      document.getElementById('btnAddServer').onclick = async ()=>{
        const id = document.getElementById('s_id').value; const name = document.getElementById('s_name').value;
        await api('/servers', { method: 'POST', body: JSON.stringify({ id, name }) }); loadServers();
      };

      async function loadUsers(){
        const r = await api('/users');
        const el = document.getElementById('users'); el.innerHTML='';
        if (r.status===200) r.body.forEach(u => el.innerHTML += `<div>${u.username} (${u.role})</div>`);
      }

      document.getElementById('btnCreateUser').onclick = async ()=>{
        const username = document.getElementById('u_name').value; const password = document.getElementById('u_pass').value; const role = document.getElementById('u_role').value;
        await api('/users', { method: 'POST', body: JSON.stringify({ username, password, role }) }); loadUsers();
      };
    </script>
  </body>
</html>
