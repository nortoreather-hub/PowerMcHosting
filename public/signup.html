<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PowerHosting Signup</title>
    <style>body{font-family:system-ui,Arial;margin:20px}input,button{padding:6px;margin:4px}</style>
  </head>
  <body>
    <h1>Sign up — PowerHosting</h1>
    <input id="username" placeholder="username" />
    <input id="email" placeholder="email" />
    <input id="password" type="password" placeholder="password" />
    <button id="btnSignup">Sign up</button>
    <div id="msg"></div>

    <script>
      document.getElementById('btnSignup').onclick = async ()=>{
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const r = await fetch('/api/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password, email }) });
        const body = await r.json().catch(()=>null);
        document.getElementById('msg').innerText = (body && (body.message || body.verifyUrl)) || 'signed up. check email if configured.';
      };
    </script>
  </body>
</html>
